className:r,children:S,disabled:T,href:w,..._}){const N=Jp(o,f,Bl((T||y)&&"opacity-60",r));return w?w.startsWith("mailto:")||w.startsWith("http")?c.jsx("a",{href:w,className:N,children:S}):c.jsx(mt,{href:w,className:N,children:S}):c.jsx("button",{className:N,disabled:T||y,"aria-busy":y||void 0,..._,children:S})}const aa=[{id:"first-day",title:"Your first day and first week",category:"Getting started",tags:["first day","week one","schedule","badge","lunch","eligibility"],summary:"Where to go, who to meet, and what done looks like after five days.",body:"Arrive at the time in your offer letter. Check in at reception or with the person named in your welcome email. You will get a badge or remote login, a desk or home setup list, and a short tour of the tools we use. Week one success is simple: access works, paperwork is in, you know how to record time, and you have asked at least one question in this assistant. Employment eligibility paperwork is due by business day 3 after your start date. Meals, breaks, and building access follow local site rules. If nobody is free when you arrive, write IT or People Ops from this tool. You do not need to wait on your manager to start."},{id:"skip-manager",title:"Questions you do not have to take to your manager",category:"How this tool works",tags:["manager","private","hr","people ops","confidential","awkward","pay"],summary:"Use this assistant, People Ops, IT, or the hotline when a manager is the wrong first stop.",body:"You are not required to ask your manager about pay, benefits, medical leave, accommodations, interpersonal conflict, ethics, or IT lockouts. This assistant answers from the company handbook. Ask privately keeps the chat on your device unless you choose to send an escalation. People Ops and IT exist so routine and sensitive topics are not blocked by one person. If your manager is the subject of the question, skip them and use People Ops or the ethics hotline. Your job is not at risk for using the official channels described here."},{id:"pay",title:"Pay, timesheets, and corrections",category:"Pay and time",tags:["pay","payroll","timesheet","direct deposit","overtime","wage","paid","paycheck","payday","paychecks","get paid"],summary:"When you are paid, how to record hours, and how to fix a mistake without a confrontation.",body:"Pay dates and direct deposit are in your offer packet and the Pay dates lookup table in this app. Hourly staff submit timesheets by the local deadline; salaried staff confirm exceptions only. Overtime follows the law for your location and role. If a paycheck looks wrong, write People Ops with the date and the amount you expected. Do not wait for a 1:1. Payroll errors are operations issues, not a personal dispute with your manager. Keep a copy of submitted hours until the correction appears."},{id:"time-off",title:"Time off, sick days, and holidays",category:"Pay and time",tags:["pto","vacation","sick","leave","holiday","time off"],summary:"How to request leave and what happens if you are unwell on a workday.",body:"Request planned time off in the timekeeping system as early as you can. Sick time is for when you cannot work safely or well; log it when you return or the same day if the system allows. Company holidays are listed in the Holidays lookup table. Parental, medical, and legally protected leave is handled by People Ops, not informal manager deals. If you are unsure which bucket applies, ask this assistant or email People Ops. A manager can plan coverage; they do not invent the policy."},{id:"benefits",title:"Benefits enrollment",category:"People Ops",tags:["benefits","health","insurance","401k","retirement","deadline","eap"],summary:"Health, retirement, and related plans, including the deadline that is easy to miss.",body:"New hires elect medical, dental, vision, and retirement contributions in the benefits portal. At Northshore Goods, benefits enrollment is due by business day 10 after your start date. Missing the window can mean waiting until the next open enrollment unless a qualifying life event applies. Plan comparisons live in the Benefits lookup table. This assistant will not choose a plan for you. The Employee Assistance Program (EAP) is a free, confidential counseling benefit for you and your household at 1-800-555-0199. Beneficiaries and dependents should be updated in the same portal you used to enroll."},{id:"it-setup",title:"Accounts, devices, and lockouts",category:"IT",tags:["it","password","mfa","laptop","email","vpn","lockout","locked","software"],summary:"First login, lost passwords, approved software, and who resets access.",body:"IT provisions email, chat, and VPN. Turn on multi-factor authentication by business day 1 after your start date. If you are locked out, use the password portal or email IT from a personal address listed in your file. Managers cannot reset most credentials. Only approved software may be installed; request new tools through IT. Lost or stolen devices must be reported to IT the same day. Home office equipment follows the remote work article if your role is hybrid or remote."},{id:"respectful-workplace",title:"Respectful workplace and reporting harm",category:"Safety and ethics",tags:["harassment","discrimination","bully","retaliation","ethics","hotline","harassing","harassed","harass","bullied","bullying","discriminated","hostile","mistreated","unfair"],summary:"How to report harassment or discrimination without going through your manager.",body:"Harassment, discrimination, and retaliation are prohibited. Report to People Ops or the ethics hotline. You may skip your manager, especially if they are involved. Retaliation for a good-faith report is itself a violation. If you are in immediate danger, contact local emergency services first. This assistant will always surface support resources for these topics. You do not need a perfect story before you write; dates, names, and what happened are enough to start."},{id:"accommodations",title:"Disability and workplace accommodations",category:"People Ops",tags:["accommodation","disability","access","medical","ergonomic"],summary:"How to request a change to your work setup or schedule for a health need.",body:"Accommodation requests go to People Ops. You do not have to disclose a diagnosis to your manager. Describe the barrier at work and the change that would help. People Ops may ask for documentation from a clinician. Ergonomic equipment is requested through IT after People Ops agrees, unless it is a standard supply. Interactive process means you will be asked questions; it is not a refusal. Deadlines and privacy follow local employment law."},{id:"hybrid-work",title:"On-site, hybrid, and remote norms",category:"How we work",tags:["remote","hybrid","office","hours","timezone","home","wfh","work from home","telework","commute"],summary:"Where you work, core hours, and how to be reachable without guessing.",body:"Your offer letter states your location model. Core hours and time zone are set in company setup so this assistant can repeat them. Hybrid roles should be on site the days your team published. Remote roles still attend scheduled meetings and keep chat status honest. If travel or a schedule change is needed, use the time-off or People Ops path, not an informal chat that never gets recorded."},{id:"first-90",title:"The first 90 days",category:"Getting started",tags:["probation","90 days","review","goals","training"],summary:"What settling in includes besides doing assigned tasks.",body:"The first 90 days are for learning the work, the tools, and the people. You should know who owns quality, who owns customers or internal users, and how work is requested. Training assigned in your checklist is required. A 30/60/90 conversation is normal; it is not only criticism. If you are missing access or training, log it here or with IT so the delay is visible. Performance concerns are discussed with your manager and People Ops together, not by rumor."},{id:"who-to-ask",title:"Who owns what",category:"How this tool works",tags:["contact","hr","it","buddy","escalation","owner"],summary:"A simple map so you are not bounced between inboxes.",body:"IT: devices, accounts, software, VPN. People Ops: pay, leave, benefits, accommodations, workplace concerns. Your buddy: unwritten norms and introductions. Your manager: priorities, quality of work, and team meetings. Ethics hotline: illegal, unsafe, or unethical conduct, including when you do not trust internal email. This assistant routes you using that map. If two teams might own it, send People Ops and say you copied IT only if it is an access issue."},{id:"emergency",title:"Emergencies, building safety, and after-hours",category:"Safety and ethics",tags:["emergency","safety","fire","after hours","unsafe"],summary:"What to do if someone is hurt, the building is unsafe, or you are working late.",body:"Life-threatening emergencies: call local emergency services, then notify a site lead if you can. Fire and evacuation maps are posted on site. After-hours work still follows the same safety rules; you are not expected to stay in an unsafe space to finish a task. Report near misses to People Ops or the site safety contact. An unsafe instruction from anyone, including a manager, can be refused and reported."},{id:"equipment",title:"Equipment, supplies, and home setup",category:"IT",tags:["equipment","laptop","monitor","headset","chair","supplies","home office","allowance","return"],summary:"What you are issued, the home office allowance, and what to do if something breaks or goes missing.",body:"IT issues a laptop, charger, and any role-specific devices on or before your first day. Hybrid and remote employees may claim a one-time home office allowance of $250 for items such as a monitor, chair, or desk accessory. Ask IT before you buy, then submit the receipt through the expense tool. Everyday supplies such as notebooks, pens, and printer paper come from the site supply area or from a request to People Ops. Report damage, loss, or theft to IT the same day; you will not be blamed for an honest accident. Ergonomic needs tied to a health condition go through the accommodations article. On your last day, return all company equipment and your badge."},{id:"expenses",title:"Expenses and reimbursements",category:"Pay and time",tags:["expense","reimbursement","receipt","reimburse","purchase","spend","approval","refund"],summary:"What you can claim, the receipt rules, and how long reimbursement takes.",body:"Submit business expenses in the expense tool within 30 days of the purchase. Attach a receipt for anything over $25. Get your manager's approval before any single purchase over $200. Reimbursements are paid with the next payroll after approval; see the Pay dates table for the schedule. Personal purchases, fines, and alcohol are not reimbursable. If a claim is rejected or looks late, write People Ops with the date, the amount, and what the expense was for. You should never have to fund company costs out of pocket for long, so ask early if you are unsure whether something qualifies."},{id:"schedules-shifts",title:"Schedules, shifts, breaks, and overtime approval",category:"Pay and time",tags:["schedule","shift","break","lunch","overtime","swap","hours","rest"],summary:"How schedules are posted, how to swap a shift, and how breaks and overtime work.",body:"Office roles work Monday to Friday, 9:00 to 17:30 local time. Store and warehouse schedules are posted at least 7 days ahead. To swap a shift, agree it with a coworker, get your manager's approval, and make sure the change is recorded in the timekeeping system. A 30-minute unpaid meal break is required on shifts longer than 6 hours, and you get a paid 10-minute rest break for every 4 hours worked. Where local law gives you more, the law applies. Overtime should be approved by your manager before it happens, but all time you actually work is paid. Record every hour even if overtime was not approved."},{id:"code-of-conduct",title:"Code of conduct and dress",category:"Safety and ethics",tags:["conduct","ethics","dress code","uniform","behavior","honesty","badge","rules"],summary:"The basic expectations for how we treat each other, customers, and company property.",body:"Be honest, be respectful, follow the law, and protect customer and company information. Do not misuse company property, falsify records, or ask anyone to break a rule for you. Dress for your role: neat and comfortable in the office, and closed-toe safety footwear where the warehouse or stockroom requires it. Wear your badge visibly on site. If you see conduct that is unsafe, dishonest, or disrespectful, raise it with People Ops or the ethics hotline at 1-800-555-0142. You do not have to be sure it is a violation before you ask. Breaking the code can lead to coaching or discipline, handled by People Ops and your manager together."},{id:"gifts-conflicts",title:"Gifts, conflicts of interest, and outside work",category:"Safety and ethics",tags:["gift","conflict of interest","side job","outside work","second job","vendor","relative","bribe"],summary:"When a gift is too big, when a second job is a problem, and what to disclose.",body:"Do not accept gifts from vendors or customers worth more than $50, and never accept cash or gift cards. Report any larger gift to People Ops, and politely decline it. You may hold a second job or run a side business if it does not compete with Northshore Goods, does not use company time or equipment, and does not affect your work. Tell People Ops before you start if there is any doubt. Disclose a family or close personal relationship with a coworker you would manage or a vendor you would select. If anyone offers or asks for a bribe, call the ethics hotline right away."},{id:"data-security",title:"Protecting customer and company data",category:"IT",tags:["security","phishing","data","privacy","password","customer data","ai tools","usb","wifi","scam"],summary:"Passwords, phishing, what never to paste into a tool, and how to report an incident.",body:"Use a unique password and keep multi-factor authentication on. Never share your credentials, even with IT; IT will never ask for your password. Lock your screen when you step away. Do not paste customer personal data, payment details, or passwords into any AI tool, including this assistant. Do not plug in unapproved USB drives. On public Wi-Fi, connect through the VPN. If an email looks suspicious, do not click it; forward it to IT at it@northshore.example. If you think you clicked something bad or lost data, report it to IT the same day. Reporting fast matters more than being right about whether it was real."},{id:"social-media",title:"Social media and speaking for the company",category:"How we work",tags:["social media","press","media","linkedin","post","public","confidential","interview"],summary:"What you can post, what to keep private, and who handles press questions.",body:"Your personal accounts are yours. Do not share confidential company information, customer details, unreleased products, or internal numbers, and make clear that your opinions are your own. Do not reply to customer complaints on your own accounts; point people to customer support. Send any request from a reporter or outside organization to People Ops rather than answering it. Nothing in this article limits your right to discuss your pay, hours, or working conditions with coworkers, or to report concerns to a government agency. Treat anything you post as public and permanent."},{id:"performance-reviews",title:"Feedback and performance reviews",category:"People Ops",tags:["review","feedback","performance","goals","rating","raise","check-in","evaluation","improvement"],summary:"How often you get feedback, what a review covers, and what to do if you disagree.",body:"Expect regular check-ins with your manager, plus a formal review once a year and a mid-year conversation. Reviews look at your goals, the quality of your work, and how you work with others. Write your own goals down early and revisit them at each check-in. If you disagree with a review, add a written comment and ask People Ops to look at it; you are allowed to do that. Pay and promotion decisions follow the review cycle, so ask People Ops when the next one is. Performance concerns are shared with you directly and early, with a clear plan and a timeline, not by surprise."},{id:"learning",title:"Training, learning budget, and certifications",category:"Getting started",tags:["training","learning","course","certification","education","budget","conference","books","development"],summary:"Required training, the yearly learning budget, and how to get a course approved.",body:"Required training, such as data security, safety, and respectful workplace, appears in your learning portal with a due date. Complete it by that date. Each employee has a $500 learning budget per year for courses, books, certifications, and conferences that relate to their role. Get your manager's approval first, pay for it, and submit the receipt in the expense tool. Time spent on approved training counts as work time. If a course is not clearly tied to your job, ask People Ops whether it qualifies. Unused budget does not roll over."},{id:"internal-moves",title:"Promotions, internal moves, and job postings",category:"People Ops",tags:["promotion","transfer","internal","job posting","new role","move teams","apply","career"],summary:"How to apply for another role here and when you need to tell your manager.",body:"Open roles are posted on the internal job board before they are advertised outside. You can apply once you have been in your current role for 12 months, or earlier with approval from your manager and People Ops. You are not required to tell your manager before you apply, but you should tell them before you accept an offer so the move can be planned. Promotions are usually decided through the review cycle. If you want to know what is needed for the next level, ask People Ops for the role description and discuss gaps in your check-ins."},{id:"protected-leave",title:"Medical, family, and other protected leave",category:"People Ops",tags:["leave","medical leave","parental","maternity","paternity","bereavement","jury duty","caregiver","fmla","military"],summary:"The kinds of leave available and the first step for asking for any of them.",body:"Northshore Goods supports medical leave, parental and family bonding leave, caregiver leave, military leave, jury duty, and bereavement. Bereavement for an immediate family member is 3 paid days. Whether you qualify for other leave, and for how long, depends on your location and how long you have worked here, and People Ops confirms this in writing. Tell People Ops as early as you can; you do not need to give details to your manager. You may be asked for documentation from a clinician, and it stays with People Ops. Benefits and your job are protected where the law says they are. Do not arrange leave informally with your manager alone."},{id:"work-injury",title:"Work injuries and workers' compensation",category:"Safety and ethics",tags:["injury","hurt","accident","workers compensation","incident report","medical","ergonomic","strain"],summary:"What to do right after an injury at work and how a claim starts.",body:"Get medical care first; call local emergency services if it is serious. Then tell the site safety contact at safety@northshore.example and People Ops the same day, even if the injury seems minor. An incident report is completed with you, and it records what happened, not who is at fault. Work-related injuries are covered by workers' compensation, which People Ops will explain, including paid medical costs and any time off. You cannot be punished for reporting an injury or filing a claim. Report near misses too, so the hazard gets fixed before someone is hurt."},{id:"employee-discount",title:"Employee discount and perks",category:"People Ops",tags:["discount","perks","employee discount","store","products","benefit","staff sale","family"],summary:"The discount on Northshore products and the other perks that come with the job.",body:"Employees receive 25 percent off regular-priced Northshore Goods products, with limits listed in the benefits portal. The discount is for you and your household; do not resell discounted items or use the discount to buy gift cards for others to cash out. Employee-only sale events are announced by email. Other perks include the Employee Assistance Program, the yearly learning budget, and the home office allowance for hybrid and remote roles. Perks are described at a high level here; the benefits portal and your offer packet have the exact terms."},{id:"leaving",title:"Leaving the company",category:"People Ops",tags:["resign","quit","notice","last day","final pay","offboarding","exit","termination","return equipment"],summary:"How to give notice, what happens to your pay and benefits, and what to return.",body:"If you decide to leave, tell your manager and People Ops in writing. Two weeks of notice is appreciated, though your offer letter or local law may set a different rule. People Ops will confirm in writing your last day, your final pay date, and any accrued time off that is paid out under local law. Your benefits usually end on a set date after your last day, and People Ops explains continuation options before then. Return your laptop, badge, and any other equipment. An exit conversation is optional and confidential, and anything you share there is used to improve the company, not held against you."},{id:"business-travel",title:"Business travel",category:"Pay and time",tags:["travel","flight","hotel","trip","per diem","mileage","booking","conference","airfare"],summary:"How to get a trip approved, booked, and reimbursed.",body:"Get your manager's approval before you book any business travel. Book through the company travel tool or ask People Ops for the booking link, and choose standard fares and reasonable hotels. Keep every receipt and submit your expenses within 30 days of the trip. Travel time during your normal hours counts as work time; for longer trips, People Ops can tell you how travel outside normal hours is handled in your location. Keep an emergency number with you, and tell your manager or People Ops if plans change or you feel unsafe. You may decline travel that you believe is unsafe."},{id:"glossary",title:"Terms you will hear",category:"How this tool works",tags:["glossary","definition","meaning","acronym","what does","mfa","pto","eap","vpn","open enrollment"],summary:"Plain meanings for the acronyms and phrases that come up in your first weeks.",body:"Business day: Monday to Friday, excluding company holidays. PTO: paid time off. EAP: Employee Assistance Program, free confidential counseling. MFA: multi-factor authentication, a second step when you sign in. VPN: a secure connection to company systems from outside the office. 1:1: a regular private meeting with your manager. People Ops: the team that handles pay, leave, benefits, and workplace concerns. Ethics hotline: a way to report concerns outside normal channels. Open enrollment: the yearly period when you can change benefit elections. Qualifying life event: a change such as marriage or a new child that lets you change benefits mid-year. 30/60/90: check-ins at roughly one, two, and three months."},{id:"disagreements",title:"Disagreements with a coworker or manager",category:"Safety and ethics",tags:["conflict","disagreement","coworker","argument","tension","difficult","mediation","complaint","grievance","fighting","clash","coworker","teammate"],summary:"Steps for working through a conflict, and when to bring in People Ops.",body:"Most conflicts are best handled early and directly, if it feels safe. Try a calm conversation about the specific behavior and what you need. If that does not work, or you do not feel safe having it, talk to your onboarding buddy or write People Ops. People Ops can coach you, arrange a facilitated conversation, or look into the issue formally. Keep notes with dates and what was said. If the behavior is harassment, discrimination, or retaliation, use the respectful workplace article instead. You will not be penalized for raising a conflict in good faith, and you can skip your manager if they are part of it."},{id:"wellbeing",title:"Wellbeing, stress, and the Employee Assistance Program",category:"People Ops",tags:["stress","wellbeing","mental health","counseling","eap","burnout","anxious","workload","support","overwhelmed"],summary:"Free confidential counseling, what to do if work feels like too much, and where to turn in a crisis.",body:"The Employee Assistance Program is free, confidential counseling for you and your household. Call 1-800-555-0199 at any time. Northshore Goods does not see who uses it. If your workload or schedule is a problem, People Ops can talk with you about options without you having to explain details to your manager. If you are in crisis or thinking about hurting yourself, call or text 988 in the United States, or your local emergency number, right now. You can also reach the EAP at any hour. Asking for help is expected here and will not affect your standing."},{id:"building-access",title:"Parking, commuting, and building access",category:"How we work",tags:["parking","commute","badge","visitor","guest","access","door","lost badge","building","transit","park","parked","garage","lot"],summary:"How your badge works, signing in guests, and what to do if you lose it.",body:"Your badge opens the doors you are cleared for and should be worn visibly. Do not hold doors open for people you do not recognize, and do not lend your badge. Guests sign in at reception, wear a visitor badge, and stay with their host. If you lose your badge, tell IT the same day so it can be turned off and replaced. Parking, transit, and bike storage details are posted at each site and at reception; if you cannot find them, ask your buddy or People Ops. After-hours access follows the emergencies and after-hours article."}];function Dh(o){return aa.find(f=>f.id===o)}function _h(o){aa.splice(0,aa.length,...o)}const $p="Sample directory for Northshore Goods. Replace this file with your company list.",Hc=[{id:"jordan-hale",name:"Jordan Hale",role:"People Partner",team:"People Ops",email:"people@northshore.example",handles:"Pay, leave, benefits, workplace concerns, accommodations"},{id:"sam-ortiz",name:"Sam Ortiz",role:"IT Lead",team:"IT",email:"it@northshore.example",handles:"Laptops, accounts, MFA, lockouts, approved software"},{id:"alex-rivera",name:"Alex Rivera",role:"Onboarding buddy",team:"Operations",email:"alex.rivera@northshore.example",handles:"Unwritten norms, introductions, first-week questions"},{id:"priya-chen",name:"Priya Chen",role:"Site safety contact",team:"Operations",email:"safety@northshore.example",handles:"Building safety, after-hours issues, incident reports"},{id:"morgan-blake",name:"Morgan Blake",role:"Payroll Specialist",team:"People Ops",email:"people@northshore.example",handles:"Paycheck questions, timesheet corrections, expense reimbursement status"},{id:"taylor-brooks",name:"Taylor Brooks",role:"Learning and Development Partner",team:"People Ops",email:"people@northshore.example",handles:"Required training, the learning budget, internal moves and job postings"},{id:"casey-nguyen",name:"Casey Nguyen",role:"Security Analyst",team:"IT",email:"it@northshore.example",handles:"Phishing reports, suspected data incidents, lost or stolen devices"}],Wp="Sample lookup tables for Northshore Goods. Replace this file with your company data.",Mh=[{id:"holidays",title:"Holidays",summary:"Company-observed holidays listed in the Northshore handbook.",columns:["Date","Holiday"],rows:[["2026-01-01","New Year's Day"],["2026-05-25","Memorial Day"],["2026-07-04","Independence Day"],["2026-09-07","Labor Day"],["2026-11-26","Thanksgiving"],["2026-12-25","Christmas Day"]]},{id:"pay-dates",title:"Pay dates",summary:"Biweekly F
