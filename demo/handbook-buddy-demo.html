By the end of business day 1 you turn on multi-factor sign-in (MFA). By business day 3 you finish your employment eligibility paperwork, which is required before you are paid. By business day 5 you complete the CRM and call-tools certification with Sales Enablement. By business day 10 you decide your benefits enrollment.

In week one you also meet your onboarding buddy, sit in on live calls with senior SDRs, and join the Mid-Market pod stand-up. You carry no quota in your first month. Your goal for week one is to learn the tools and the pitch, not to book meetings.`},{id:"first-90",title:"Your first 90 days and ramp",category:"1. Start here",tags:["first 90","30 60 90","ramp","ramping","new hire","onboarding","training"],summary:"What to expect in days 1 to 30, 31 to 60, and 61 to 90.",body:`Days 1 to 30 are for learning. You complete product and sales training, shadow calls, and build your first account list. There is no quota in month one.

Days 31 to 60 are your first ramp month. Your target is 50 percent of full quota, which is 6 meetings held, and you run your own cadences with weekly coaching.

Days 61 to 90 are your second ramp month. Your target is 75 percent of full quota, which is 9 meetings held. At day 90 you have a review with your manager covering results, skills and goals. From month four you carry the full quota of 12 meetings held per month.

If you are behind in month two or three, tell your manager early. Ramp is a plan, not a test, and your manager can adjust coaching.`},{id:"skip-manager",title:"Questions you do not have to take to your manager",category:"1. Start here",tags:["manager","private","hr","people ops","confidential","awkward","pay"],summary:"Use this assistant, People Ops, IT, or the hotline when your manager is the wrong first stop.",body:`You never have to ask your manager about pay, benefits, medical leave, accommodations, conflict with your manager, ethics, or an IT lockout. This assistant answers from the company handbook, and what you ask here is not shared with your manager.

If you want a person, write People Ops at people@lumenfield.example or IT at it@lumenfield.example. For anything illegal, unsafe or unethical, call the ethics hotline at 1-800-555-0142.

For day-to-day sales questions, your manager and your onboarding buddy are usually the fastest help, and asking them is encouraged.`},{id:"who-to-ask",title:"Who to ask for what",category:"1. Start here",tags:["contact","who","directory","payroll","enablement","revops","legal","compliance","help"],summary:"A quick map from the kind of question to the right person or inbox.",body:`Pay, leave, benefits, accommodations and workplace concerns: People Ops, people@lumenfield.example. Paycheck and commission statement questions also go there.

Laptop, accounts, MFA, lockouts and approved software: IT, it@lumenfield.example. Phishing or a lost device: IT right away.

CRM fields, territories, lead routing and reports: RevOps, revops@lumenfield.example.

Training, certifications, call libraries and messaging: Sales Enablement, enablement@lumenfield.example.

What you can say to a prospect, recording and do-not-call questions: Legal and Compliance, compliance@lumenfield.example.

Building safety and badges: safety@lumenfield.example. Unwritten norms and first-week questions: your onboarding buddy, Marcus Hill.`},{id:"glossary",title:"Sales and workplace terms",category:"1. Start here",tags:["glossary","acronym","terms","sdr","ae","icp","cadence","quota","mfa","eap","ote"],summary:"Plain-language meanings for the short forms you will hear in week one.",body:`SDR: Sales Development Representative. You find and start conversations with potential customers.

AE: Account Executive. The seller who runs the sales process after your meeting.

ICP: ideal customer profile. The kind of company we sell to best.

Cadence: a planned series of calls, emails and LinkedIn touches to one prospect.

Connect: a call where you speak to the person. Dial: any call attempt.

Meeting held: a first meeting a qualified prospect attended with an AE.

Pod: your small SDR team, such as Mid-Market. Quota: your monthly target of meetings held. Ramp: the first months with a reduced quota. OTE: on-target earnings, base pay plus variable pay at 100 percent of quota.

CRM: the system where all customer records live. MFA: multi-factor authentication, a second step when you sign in. EAP: Employee Assistance Program, free and confidential counseling. PTO: paid time off.`},{id:"sdr-role",title:"What an SDR does at Lumenfield",category:"2. Your SDR role",tags:["sdr","role","job","responsibilities","outbound","inbound","prospecting","meetings"],summary:"Your job in one page: start the right conversations and hand them to an AE.",body:`As an SDR you open sales conversations. You research target accounts, reach the right people by phone, email and LinkedIn, learn whether there is a real need, and book a first meeting for an Account Executive.

You work outbound on your assigned accounts and take your turn on the inbound queue, answering people who ask for a demo or contact us. You do not negotiate price or run demos. That is the AE's job after your handoff.

You are measured on meetings held with qualified prospects, not on activity alone. Activity targets exist because consistent activity is how meetings happen.`},{id:"daily-rhythm",title:"Your day and weekly targets",category:"2. Your SDR role",tags:["daily","schedule","routine","activity","targets","dials","emails","call block","stand-up","hours"],summary:"A typical day, the full-ramp activity targets, and your working hours.",body:`Core hours are Monday to Friday, 8:30 to 17:30 Central. A typical day: 8:45 pod stand-up, 9:00 to 11:00 call block, 11:00 to 12:00 email and LinkedIn touches, an afternoon block for research, follow-ups and CRM updates, and a short wrap-up at the end of the day.

At full ramp the daily targets are 60 dials, 40 personalized emails and 20 LinkedIn touches. In your ramp months your targets are 50 percent and 75 percent of those numbers.

You get a one-hour lunch break. Protect your call block: meetings with your manager are scheduled outside it whenever possible. If you work through lunch for a prospect, tell your manager so you can take the time back.`},{id:"icp-territory",title:"Ideal customers and territories",category:"2. Your SDR role",tags:["icp","territory","accounts","account","owner","owns","own","assigned","ownership","segment","mid-market","enterprise","poaching","target"],summary:"Who we sell to, which accounts are yours, and when ownership changes.",body:`Our ideal customer is a company with roughly 100 to 5,000 employees and a sales team of ten or more. The best titles to reach are sales leaders and revenue operations leaders. The Mid-Market pod covers companies from 100 to 999 employees. The Enterprise pod covers 1,000 and above.

RevOps assigns each SDR a list of accounts in the CRM. An account you own is yours to work. Do not contact an account owned by another SDR or an AE.

If an owned account has no logged activity for 90 days, RevOps can recycle it to the pool. Territory changes are announced by your manager at the start of each quarter.`},{id:"cadences",title:"Cadences and outreach messages",category:"2. Your SDR role",tags:["cadence","sequence","email","template","linkedin","touches","personalization","outreach","follow up"],summary:"The standard sequence, how much you can customize, and what you cannot change.",body:`The standard cadence is 12 touches over 21 days, mixing calls, emails and LinkedIn messages. Enablement keeps approved templates in the sequencing tool.

You are expected to personalize the opening line of every email with something true about the person or their company. You may write your own messages, but they must follow the messaging rules and keep the unsubscribe link and company footer that the tool adds.

A prospect who replies, books a meeting or asks to stop must be removed from the cadence the same day. Pause cadences if you will be out for more than two days.`},{id:"crm-hygiene",title:"Logging work in the CRM",category:"2. Your SDR role",tags:["crm","logging","notes","records","duplicates","next step","hygiene","data","fields"],summary:"What to record, how fast, and why unlogged work does not count.",body:`The CRM is the system of record. If it is not in the CRM, it did not happen for quota, commission or territory purposes.

Log every call, meeting and meaningful email within one business day. Every open prospect needs a next step and a date. Check for an existing account or contact before you create a new one, because duplicates break routing and reports.

Keep notes factual and professional. Prospects and colleagues can be shown these notes, and they may be requested in a legal matter. Do not record health, financial or other personal details that are not needed for the sale. RevOps runs a weekly hygiene report, and your manager will go through it with you.`},{id:"lead-handoff",title:"Inbound leads, handoffs and what counts as a meeting",category:"2. Your SDR role",tags:["inbound","lead","handoff","meeting held","sql","qualified","no-show","credit","routing","demo request"],summary:"How inbound leads reach you, how you hand off to an AE, and when a meeting counts toward quota.",body:`Inbound leads are routed to the SDR on the inbound rota that week. Reply to an inbound lead within one business hour during core hours.

When a prospect fits our ideal customer profile and has a real need, book a first meeting on the AE's calendar and fill in the handoff form in the CRM, including the pain points you heard.

A meeting counts as held when a qualified prospect attends for at least 20 minutes and the AE marks it as qualified in the CRM within two business days. If a prospect does not show up, reschedule once within five business days. A meeting that does not count, such as one with a student or a competitor, is explained to you in writing. Questions about credit go to your manager first, then RevOps.`},{id:"tools",title:"Your sales tools",category:"2. Your SDR role",tags:["tools","software","dialer","crm","sequencing","linkedin","sales navigator","scheduler","slack","ai assistant"],summary:"The tools you use every day and where to get help with each.",body:`You work in a small set of tools. The CRM holds all accounts, contacts and activity. The sequencing tool runs your cadences. The dialer places calls and records them. The data provider gives you contact details. LinkedIn Sales Navigator is used for research and messaging through your company account. The scheduler lets prospects book time on an AE's calendar. Slack is for your pod and for asking quick questions.

The company AI assistant may be used for research and drafting. Check anything it writes before you send it, and never paste personal prospect details into any AI tool that is not approved by IT.

You get access to all of these in your first week. If one is missing on day 2, ask IT. For how to use a tool, ask Enablement or your buddy.`},{id:"outreach-rules",title:"Calling, email and recording rules",category:"2. Your SDR role",tags:["do not call","opt out","unsubscribe","recording","consent","gdpr","can-spam","tcpa","compliance","calling hours"],summary:"The legal rules for contacting people. Following them is part of the job.",body:`Check the do-not-call list before you dial. Do not call before 8:00 or after 21:00 in the prospect's local time. If someone asks you to stop, stop, record it in the CRM, and make sure they are removed from all cadences within two business days.

Every marketing-style email must include an unsubscribe link and the company address. The sequencing tool adds these. Do not remove them.

Calls are recorded for coaching. Say so at the start of each call. Some states and countries require everyone on the call to agree, so if a person objects, end the recording and the call.

For contacts in the European Union or the United Kingdom, use only the sequences Compliance has approved for those countries. Questions go to compliance@lumenfield.example.`},{id:"messaging-rules",title:"What you can and cannot say to prospects",category:"2. Your SDR role",tags:["messaging","claims","pricing","roadmap","competitor","customer names","case study","promises","say"],summary:"Approved claims, no price quotes, no promises about future features.",body:`Use the claims, case studies and customer names in the approved messaging library. Do not make up statistics or quote a customer who is not on the approved list.

Do not quote pricing or discounts. Pricing is discussed by the AE. If asked, say an AE can go through options in the meeting.

Do not promise features that are not released, and do not guess at dates. Say that you will find out from the AE or product team.

Speak about competitors factually and respectfully. Do not criticize them or repeat rumors. If you are unsure whether something is allowed, ask Enablement or Compliance before you send it.`},{id:"coaching",title:"Coaching, 1:1s and call reviews",category:"2. Your SDR role",tags:["coaching","1:1","one on one","call review","feedback","manager","pipeline","development"],summary:"The weekly rhythm of feedback you can expect from your manager.",body:`You have a weekly 30-minute 1:1 with your manager. Bring your numbers, your hardest accounts and one thing you want to improve.

Each week your manager or a senior SDR reviews one or two of your recorded calls with you. The goal is to find one thing to repeat and one thing to change. Reviews are for coaching. They are not a trap.

You are also encouraged to listen to the call library and to ask a senior SDR to review a call you were unsure about. You can ask your buddy for an extra review at any time. Feedback you disagree with can be raised with your manager, or with People Ops if you prefer to go outside the team.`},{id:"pay",title:"Pay dates and corrections",category:"3. Pay and compensation",tags:["pay","payroll","paycheck","payday","direct deposit","paid","get paid","wage","salary","correction"],summary:"When you are paid, what is paid when, and how to fix a mistake.",body:`Base pay is paid twice a month, on the 15th and on the last business day. Direct deposit details are in your offer packet and in the pay dates table in this app. Your first paycheck needs your eligibility paperwork completed by business day 3.

Commission and other variable pay for a month is paid with the payroll on the 15th of the following month.

If you spot an error in your pay or deductions, write People Ops at people@lumenfield.example with the pay date and what you expected. You do not need your manager's approval. A confirmed underpayment is corrected in the next payroll, or sooner if the amount is large. Overpayments are corrected with a written plan agreed with you.`},{id:"comp-plan",title:"Quota, commission and your ramp",category:"3. Pay and compensation",tags:["commission","quota","variable","ote","accelerator","attainment","bonus","ramp","comp plan","spiff","clawback"],summary:"How your variable pay works. The numbers here are samples; your offer letter has yours.",body:`Your pay has two parts: base pay and variable pay. Variable pay is earned on meetings held. Your offer letter states your base, your variable target and your on-target earnings.

Full quota is 12 meetings held per month. During ramp, your quota is 0 in month one, 6 in month two and 9 in month three, and your variable pay is set against that reduced quota.

Variable pay starts once you reach 50 percent of quota. Attainment above 100 percent earns accelerated rates. A held meeting that is later found not to qualify may be adjusted in the following month. Spiffs and contests are announced in writing with their rules.

Commission statements are available monthly. If you disagree with a statement, write People Ops within 30 days with the meetings in question.`},{id:"expenses",title:"Expenses and reimbursements",category:"3. Pay and compensation",tags:["expenses","reimbursement","receipt","approval","meals","reimburse","submit","spend"],summary:"What you can claim, which receipts are needed, and the 30-day deadline.",body:`The company reimburses reasonable business expenses. A receipt is required for any expense over $25. Any single purchase over $200 needs your manager's approval before you buy it.

Submit expenses within 30 days of spending the money. Late claims may not be paid. Personal expenses, alcohol outside an approved event and fines are not reimbursed.

Paid status is visible in the expense tool. If a claim has been pending for more than ten business days, write People Ops. Never pay for a prospect's meal, gift or travel without approval first, because this can be a gift-policy issue.`},{id:"referral-bonus",title:"Referral bonus",category:"3. Pay and compensation",tags:["referral","refer","bonus","recruiting","friend","candidate","hire"],summary:"How to refer someone for a role and when the bonus is paid.",body:`If you refer a candidate who is hired, you receive a $2,000 referral bonus after the new hire completes 90 days. Submit the referral through the careers portal before the candidate applies, so it is recorded.

You can refer anyone except members of your own management chain or People Ops. You cannot influence the hiring decision for a person you referred.

The bonus is paid with the next regular payroll after the 90-day date and is taxable. You must still be employed at the time of payment.`},{id:"time-off",title:"Paid time off, sick days and holidays",category:"4. Time off and leave",tags:["pto","vacation","sick","leave","holiday","time off","days off","request"],summary:"How much time off you have, how to request it, and what to do when you are sick.",body:`You accrue 15 days of PTO per year, added each pay period from your start date. You also have 5 paid sick days per year. Company holidays are listed in the holidays table in this app and do not use PTO.

Request planned PTO in the time-off system as early as you can. Your manager approves it based on pod coverage, and approval is not unreasonably withheld. Plan around quarter end, when coverage is tight.

If you are sick, message your manager and your pod by 8:45 and mark the day as sick time. Do not work while sick. If you are out for more than three days in a row, People Ops may ask you to confirm in writing.`},{id:"protected-leave",title:"Family, medical and other leave",category:"4. Time off and leave",tags:["leave","fmla","parental","bereavement","medical","caregiver","jury","military","maternity","paternity","family"],summary:"The types of leave, who to tell, and what to expect.",body:`Lumenfield supports medical leave, parental and family bonding leave, caregiver leave, military leave, jury duty, and bereavement. Write People Ops at people@lumenfield.example as early as you can. You do not need to explain the details to your manager.

Parental leave is up to 12 weeks paid for the birth or adoption of a child. Bereavement for an immediate family member is 3 paid days. Medical and caregiver leave follow the law and may require documentation, which stays with People Ops.

While you are on leave, commission is handled by the plan rules that People Ops will explain in writing before your leave starts. Your job or an equivalent job is protected as required by law.`},{id:"hybrid-work",title:"Where and when you work",category:"4. Time off and leave",tags:["hybrid","remote","office","work from home","wfh","commute","location","in office","telework","home"],summary:"The hybrid schedule and what to do if you need something different.",body:`Lumenfield is hybrid. You work from the Austin office on Tuesday, Wednesday and Thursday, and from home on Monday and Friday. Your pod's call blocks run at the same times in either place.

When you work from home you need a quiet space, a reliable connection and the company laptop and headset. You can claim the one-time $250 home office allowance. See Equipment and home office allowance.

If you want a different arrangement, ask your manager, and People Ops can help if it is related to health or disability. Working from a different state or country for more than a few days needs approval first, because it can change tax and legal rules.`},{id:"benefits",title:"Benefits enrollment",category:"5. Benefits, perks and equipment",tags:["benefits","health","insurance","401k","retirement","deadline","dental","vision","enroll","match"],summary:"What is offered and the enrollment deadline of business day 10.",body:`Lumenfield offers medical, dental and vision coverage, a 401(k) with a company match of up to 4 percent of pay, and the Employee Assistance Program.

You must choose your benefits by business day 10. After that window, you can usually change them only after a qualifying life event, such as marriage or the birth of a child. Open the benefits article and the benefits table in this app before you decide.

Coverage starts on your start date once you enroll. Questions about plans or costs go to People Ops at people@lumenfield.example. The EAP is free and confidential, and the number is 1-800-555-0199.`},{id:"wellbeing",title:"Wellbeing and handling rejection",category:"5. Benefits, perks and equipment",tags:["wellbeing","stress","burnout","overwhelmed","rejection","mental health","eap","anxious","tired","support"],summary:"Most calls end in a no. Here is how we support you, and free confidential help.",body:`Most calls and emails get no reply or a no. That is a normal part of the job and not a measure of you. Talk it through with your buddy or your manager, who have been there.

Take your breaks. Step away after a hard call. Use PTO when you need it, and do not carry a bad day into the next one.

The Employee Assistance Program is free, confidential and open to you and your household at 1-800-555-0199. You do not need your manager's approval, and your manager is not told that you called.

If you feel unsafe or are in crisis, call local emergency services or the 988 Suicide and Crisis Lifeline in the United States.`},{id:"learning",title:"Learning budget and certifications",category:"5. Benefits, perks and equipment",tags:["learning","training","course","budget","certification","development","book","conference","education"],summary:"A $500 yearly learning budget and free internal training.",body:`Each employee has a $500 learning budget per year for courses, books and approved events. Ask your manager for approval before you spend it and submit the receipt as an expense.

Internal training from Sales Enablement is free and does not use the budget. This includes product certification, call-skills workshops and the AE shadow program.

If a course will take working time, agree on the hours with your manager. The budget does not carry over to the next year. Leah Brooks in Sales Enablement can help you find the right course.`},{id:"equipment",title:"Equipment and home office allowance",category:"5. Benefits, perks and equipment",tags:["equipment","laptop","monitor","headset","allowance","home office","desk","chair","stipend","setup"],summary:"What you receive, the $250 allowance, and how to replace broken equipment.",body:`You receive a laptop and a headset. Office desks come with a monitor. Hybrid and remote employees can claim a one-time $250 home office allowance for items such as a monitor, chair or desk. Keep the receipt and submit it as an expense.

If equipment breaks, stops working or is lost, tell IT at it@lumenfield.example the same day. A stolen device is also reported to Security right away.

Company equipment stays the property of the company. Use it for work, keep it secure and return it when you leave. You can use a personal phone for MFA, but not to store prospect data.`},{id:"it-setup",title:"Accounts, sign-in and IT help",category:"5. Benefits, perks and equipment",tags:["it","access","account","password","mfa","locked out","lockout","login","email","laptop","reset","sign in"],summary:"Turn on MFA by business day 1 and where to go when you cannot sign in.",body:`IT sends a first-login email before your start date. Turn on multi-factor authentication by business day 1. If the email did not arrive, write IT at it@lumenfield.example. You do not need your manager.

If you are locked out, use the self-service password reset, or contact IT with your name and what you were trying to open. IT will verify who you are before it resets anything.

Install only approved software. If you need a tool that is not on the list, ask IT for a review first. Never share a password or an MFA code, even with someone who says they work in IT.`},{id:"code-of-conduct",title:"Standard of conduct",category:"6. Workplace policies",tags:["conduct","ethics","behavior","dress code","honesty","standards","rules","professional","drugs","alcohol"],summary:"How we expect everyone to behave, with customers and with each other.",body:`Be honest, treat people with respect, and follow the law. Do not mislead a prospect, a customer or a colleague, and never change CRM records to make numbers look better.

Dress for your day. Business casual is fine in the office, and you should look professional on camera for calls.

Do not work under the influence of alcohol or illegal drugs. Alcohol at company events is optional and in moderation. A workplace relationship with someone in your reporting line needs to be disclosed to People Ops.

If you see conduct that breaks the law or these standards, raise it with People Ops or the ethics hotline at 1-800-555-0142.`},{id:"respectful-workplace",title:"Respectful workplace and reporting harm",category:"6. Workplace policies",tags:["harassment","discrimination","respect","report","complaint","retaliation","bullying","bullied","harassing","harassed","harass","discriminated","hostile","mistreated","unfair","hotline"],summary:"What is not allowed, how to report it, and what protects you.",body:`Harassment, discrimination, bullying and retaliation are not allowed. This includes unwelcome comments, jokes, messages or behavior, and it applies in the office, on calls, on Slack, at events and with customers.

You can report a concern to People Ops at people@lumenfield.example, to the ethics hotline at 1-800-555-0142, or to any manager. You do not have to go to your own manager, and you do not need proof to speak up.

People Ops reviews every report promptly and fairly, shares information only with those who need it, and may take interim steps to protect you. Retaliation against anyone who reports in good faith, or who helps with a review, is itself a violation. If you are in immediate danger, call local emergency services.`},{id:"accommodations",title:"Accommodations and accessibility",category:"6. Workplace policies",tags:["accommodation","disability","accessibility","ada","religion","religious","adjustment","pregnancy","ergonomic"],summary:"How to ask for a change to your work setup for health, disability or religion.",body:`Lumenfield provides reasonable accommodations for disability, medical conditions, pregnancy and religious practice, unless doing so would cause undue hardship. Examples include a different call schedule, accessible tools, an ergonomic setup, or time for prayer.

Write People Ops at people@lumenfield.example. You do not need to tell your manager your diagnosis. People Ops may ask for limited documentation, and it stays confidential.

You can ask at any time, including before you start. Requests are handled in conversation with you, and the company will not retaliate against anyone for asking. Sales tools and this handbook are designed to be used with a keyboard and screen reader. Tell IT if something does not work for you.`},{id:"gifts-conflicts",title:"Gifts and conflicts of interest",category:"6. Workplace policies",tags:["gift","gifts","vendor","bribe","conflict","second job","outside work","moonlighting","entertainment","side business","anti-bribery"],summary:"The $50 gift limit, what you cannot accept, and outside work.",body:`Do not accept a gift from a vendor, customer or prospect worth more than $50, and never accept cash or gift cards. Tell your manager about any gift you decline or accept.

You may send a small gift to a prospect only with your manager's approval, within $50, and never cash or gift cards. Never offer anything of value to try to win business improperly, and never offer anything to a government official. This is the anti-bribery rule.

You can have a second job or business if it does not compete with Lumenfield, use company time or tools, or create a conflict. Disclose it to your manager and People Ops first. If you are unsure whether something is a conflict, ask People Ops or Compliance before you act.`},{id:"data-security",title:"Customer data and security",category:"6. Workplace policies",tags:["security","data","phishing","privacy","customer data","ai","chatgpt","confidential","password","device","breach","suspicious"],summary:"How to protect prospect and company data, and what to do when something looks wrong.",body:`Prospect and customer data stays in approved tools. Do not export lists to personal email, personal cloud storage or a personal phone, and do not take screenshots of customer records.

Do not paste personal prospect details or confidential company information into any AI tool that IT has not approved. Use the approved company AI assistant for drafting and research.

If you get a suspicious email, do not click it. Report it to IT at it@lumenfield.example. If you click something by mistake, tell IT immediately. Quick reports limit the damage, and nobody is punished for reporting in good faith.

Report a lost or stolen laptop or phone right away. Complete the annual security training when you are assigned it.`},{id:"social-media",title:"Social media and talking to the press",category:"6. Workplace policies",tags:["social media","linkedin","post","twitter","press","reporter","media","public","brand","personal account"],summary:"What you can post, how to use LinkedIn for work, and where media questions go.",body:`You can share your job and talk about Lumenfield on your own accounts. Say that the views are yours, and do not share confidential information, unreleased plans, customer names that are not public, or anything about colleagues without their agreement.

Use your company LinkedIn Sales Navigator for outreach, and follow the same messaging rules as for email. Do not use fake profiles or collect data from LinkedIn with unapproved tools.

If a reporter or analyst contacts you, do not answer. Forward the request to press@lumenfield.example. Do not argue with critics or competitors online. If you see a problem, report it to your manager.`},{id:"disagreements",title:"Disagreements and territory disputes",category:"6. Workplace policies",tags:["disagree","conflict","dispute","coworker","teammate","territory","fighting","clash","credit","poached","argument"],summary:"How to settle friction with a colleague, and who decides disputes about accounts or credit.",body:`Most disagreements are best settled by a direct, calm conversation. Say what you saw, how it affected your work and what you would like to change.

If that does not work, ask your manager to help. If you would rather not involve your manager, People Ops will help you at people@lumenfield.example.

Disputes about who owns an account, or who gets credit for a meeting, are decided by your SDR manager together with RevOps. Gather the CRM activity history before you raise it. Do not contact a prospect that someone else may own while a dispute is open. Decisions are written down and final for that quarter. Harassment or discrimination is not a disagreement and goes through the respectful workplace process.`},{id:"emergency",title:"Emergencies and safety",category:"6. Workplace policies",tags:["emergency","fire","evacuation","safety","911","injury","alarm","weather","medical emergency","security"],summary:"What to do in an emergency, in the office or at home.",body:`In any emergency, call 911 or your local emergency number first. Then tell safety@lumenfield.example.

In the office, follow the evacuation signs when the alarm sounds, use the stairs, and meet at the assembly point shown on the floor map. Do not go back for belongings. Tell the floor warden if someone needs help to leave.

If severe weather or another event closes the office, your manager will message the pod and you will work from home. If you are working from home and have an emergency, make sure your manager knows how to reach you when it is safe.`},{id:"work-injury",title:"If you are hurt at work",category:"6. Workplace policies",tags:["injury","hurt","accident","work injury","workers comp","incident","medical","sprain","unsafe"],summary:"Get care first, then report it the same day.",body:`Get medical care first. In an emergency, call 911.

Report any injury or near miss to safety@lumenfield.example and to People Ops on the same day, even if it seems small. This includes injuries that happen while working from home.

People Ops explains workers' compensation, which covers medical care and lost pay for work-related injuries, and helps with the forms. You will not be penalized for reporting an injury or an unsafe condition. If an unsafe condition continues, tell safety@lumenfield.example or call the ethics hotline at 1-800-555-0142.`},{id:"building-access",title:"Building access, badges and parking",category:"6. Workplace policies",tags:["badge","access","building","office","parking","park","parked","garage","lot","visitor","guest","key card"],summary:"How to get a badge, replace a lost one, and where to park.",body:`Collect your badge at reception on your first day. Wear it visibly and do not lend it to anyone. Badges open the office from 6:00 to 20:00 on workdays.

If you lose your badge, tell safety@lumenfield.example right away so it can be turned off, and ask for a replacement at reception.

Employees can park in Garage B using their badge, and levels 2 and 3 are reserved for visitors. Guests must be signed in at reception and escorted at all times. Do not hold the door open for people you do not know. Ask them to badge in or go to reception.`},{id:"business-travel",title:"Events and business travel",category:"6. Workplace policies",tags:["travel","trip","flight","hotel","events","conference","trade show","business travel","booking","meals"],summary:"How to get approval for a trip or event and what is reimbursed.",body:`Business travel and events must be approved by your manager before you book. Book through the company travel tool, in economy class and at reasonable hotels.

Meals on a trip are reimbursed at reasonable cost with receipts for anything over $25. Alcohol is not reimbursed outside an approved event. Submit your expenses within 30 days of returning.

You may be asked to staff a booth or attend an event. Follow the same messaging and data rules as everywhere else, and do not collect badge scans or business cards in a way that the privacy rules do not allow. Tell your manager and safety@lumenfield.example if you have an emergency while traveling.`},{id:"performance-reviews",title:"Performance reviews and feedback",category:"7. Growth and leaving",tags:["performance","review","feedback","goals","rating","improvement","pip","evaluation","quarterly","attainment"],summary:"How and when you get reviewed, and what happens if you are behind.",body:`You get ongoing feedback in your 1:1s and call reviews, and a written review every quarter. Reviews cover results against quota, skills such as discovery and objection handling, and how you work with your pod and the AEs.

You can add your own comments before the review is final, and you can ask for a person from People Ops to join if you want.

If you are behind after your ramp, your manager makes a written support plan with you for 30 days. It lists the goal, the coaching and the check-in dates. It is intended to help you get back on track. Questions about the process can be asked privately at people@lumenfield.example.`},{id:"internal-moves",title:"Promotions and moving to other roles",category:"7. Growth and leaving",tags:["promotion","promoted","internal","transfer","career","ae","account executive","senior sdr","move","growth","advance"],summary:"How SDRs become Senior SDRs and Account Executives, and how to apply internally.",body:`Many Account Executives start as SDRs. A typical path is SDR, then Senior SDR after about 9 to 12 months, then Account Executive after about 12 to 18 months. The timing depends on results, not tenure.

For a promotion you generally need three consecutive quarters at or above quota, strong call reviews, and a recommendation from your manager. Join the AE shadow program through Enablement to see the next role up close.

To apply for another role, look at the internal postings. You may apply after six months in your role, and you must tell your manager when your application reaches the interview stage. Your manager cannot block your move. Dana Whitfield in People Ops can answer process questions.`},{id:"leaving",title:"Leaving Lumenfield",category:"7. Growth and leaving",tags:["leaving","quit","resign","notice","termination","final pay","offboarding","exit","resignation","last day"],summary:"Notice, final pay and commission, and returning equipment.",body:`Employment at Lumenfield is at will, which means you or the company can end it at any time. If you decide to leave, please give two weeks' notice to your manager and People Ops.

Your final pay, including unused PTO where the law requires it, is paid by the next payday or sooner if your state requires it. Commission on meetings held before your last day is paid under the plan terms. People Ops will explain this in writing.

Return your laptop, headset and badge within five business days, and do not keep any prospect data. Your benefits end on the date People Ops confirms, and you will get information about continuing coverage. You can talk to People Ops at any time before you decide.`}];function Fo(o){return _t.find(f=>f.id===o)}function Jm(o){_t.splice(0,_t.length,...o)}function Yl(...o){return o.filter(Boolean).join(" ")}function yg(o="primary",f="md",m){const r={primary:"bg-[var(--btn)] text-[var(--on-btn)]",secondary:"border border-[var(--navy)] bg-[var(--surface)] text-[var(--navy)]",ghost:"bg-transparent text-[var(--navy)] hover:bg-[var(--wash)]",danger:"bg-[var(--btn-danger)] text-[var(--on-btn)]",ai:"bg-[var(--btn-ai)] text-[var(--on-btn-ai)]"}[o];return Yl("inline-flex items-center justify-center gap-2 rounded-[var(--radius)] font-semibold transition-colors duration-[var(--duration)] ease-out",f==="md"?"min-h-11 px-5":"min-h-9 px-3 text-sm",r,m)}function Ae({variant:o="primary",size:f="md",loading:m=!1,className:r,children:g,disabled:w,href:S,...z}){const T=yg(o,f,Yl((w||m)&&"opacity-60",r));return S?S.startsWith("mailto:")||S.startsWith("http")?s.jsx("a",{href:S,className:T,children:g}):s.jsx(Je,{href:S,className:T,children:g}):s.jsx("button",{className:T,disabled:w||m,"aria-busy":m||void 0,...z,children:g})}const pg="Sample directory for Lumenfield, a fictional company. All names are invented. Replace this file with your company list.",ou=[{id:"priya-natarajan",name:"Priya Natarajan",role:"SDR Manager",team:"Sales Development",email:"priya.natarajan@lumenfield.example",handles:"Your 1:1s, quota, coaching, territory and credit decisions, time-off approval"},{id:"marcus-hill",name:"Marcus Hill",role:"Senior SDR and onboarding buddy",team:"Sales Development",email:"marcus.hill@lumenfield.example",handles:"Unwritten norms, call shadowing, first-week questions, introductions"},{id:"dana-whitfield",name:"Dana Whitfield",role:"People Partner",team:"People Ops",email:"people@lumenfi
